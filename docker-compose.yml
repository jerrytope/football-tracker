services:
  # ─────────────────────────────────────────────
  # PostgreSQL 15 — Primary Database
  # ─────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: ft_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-football_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-ft_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ft_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ft_user} -d ${POSTGRES_DB:-football_tracker}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # Redis 7 — Celery Broker & Result Backend
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ft_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # Adminer — Web-based DB Inspector
  # Access at: http://localhost:8080
  # System: PostgreSQL | Server: db | User: ft_user
  # ─────────────────────────────────────────────
  adminer:
    image: adminer:4
    container_name: ft_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: db

  # ─────────────────────────────────────────────────────────────
  # CV Engine — CPU-based AI worker (development)
  # Usage:
  #   docker compose run --rm cv_engine python cv_engine/validation/validate_output.py
  #   docker compose run --rm cv_engine /bin/bash
  # To rebuild after code changes:
  #   docker compose build cv_engine
  # ─────────────────────────────────────────────────────────────
  cv_engine:
    build:
      context: .
      dockerfile: docker/Dockerfile.cv_engine
    container_name: ft_cv_engine
    # Run on-demand only — not a long-lived daemon
    profiles:
      - cv
    env_file:
      - .env
    volumes:
      # Mount local source for live code edits (no rebuild needed)
      - ./cv_engine:/app/cv_engine
      # Persist weights across runs (don't re-download every time)
      - cv_weights:/app/cv_engine/weights
      # Output PNGs from validation scripts land here
      - ./cv_engine/output:/app/cv_engine/output
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app
    # cv_engine talks to Postgres directly in Phase 3+
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  cv_weights:
